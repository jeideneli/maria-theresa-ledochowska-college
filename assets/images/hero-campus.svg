<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F243E"/>
      <stop offset="40%" stop-color="#1B3B6F"/>
      <stop offset="70%" stop-color="#2D5A9E"/>
      <stop offset="100%" stop-color="#F2994A"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C4127"/>
      <stop offset="100%" stop-color="#6F2815"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E5E3A"/>
      <stop offset="50%" stop-color="#134327"/>
      <stop offset="100%" stop-color="#0A2414"/>
    </linearGradient>
    <linearGradient id="goldRoof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3C623"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <filter id="buildingGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky & Atmospheric Dawn in Lugazi -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Distant Rolling Hills of Buikwe District -->
  <path d="M 0 620 Q 350 540 750 590 T 1500 560 Q 1750 530 1920 570 L 1920 800 L 0 800 Z" fill="#143424" opacity="0.8"/>
  <path d="M 0 660 Q 420 600 950 640 T 1920 620 L 1920 850 L 0 850 Z" fill="#0E291B" opacity="0.9"/>

  <!-- Lush Green Quadrangle / Lawn -->
  <rect y="740" width="1920" height="340" fill="url(#lawnGrad)"/>
  <path d="M 960 740 L 720 1080 L 1200 1080 Z" fill="#E2E8F0" opacity="0.18"/> <!-- Grand Central Promenade Walkway -->

  <!-- Stately Main Administration & Academic Complex -->
  <!-- Wing Left -->
  <rect x="260" y="440" width="460" height="300" fill="url(#buildingGrad)" rx="4"/>
  <polygon points="250,440 490,340 730,440" fill="url(#brickGrad)"/>
  <!-- Wing Right -->
  <rect x="1200" y="440" width="460" height="300" fill="url(#buildingGrad)" rx="4"/>
  <polygon points="1190,440 1430,340 1670,440" fill="url(#brickGrad)"/>

  <!-- Central Great Hall & Tower -->
  <rect x="680" y="380" width="560" height="360" fill="url(#buildingGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="660,380 960,250 1260,380" fill="url(#goldRoof)"/>

  <!-- Majestic Clock & Bell Tower -->
  <rect x="880" y="160" width="160" height="230" fill="url(#buildingGrad)"/>
  <polygon points="860,160 960,60 1060,160" fill="url(#goldRoof)"/>
  <!-- Tower Clock -->
  <circle cx="960" cy="220" r="36" fill="#0A192F" stroke="#D4AF37" stroke-width="4"/>
  <circle cx="960" cy="220" r="3" fill="#D4AF37"/>
  <line x1="960" y1="220" x2="960" y2="196" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="960" y1="220" x2="978" y2="220" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Neoclassical Columns -->
  <g fill="#FFFFFF" opacity="0.95">
    <rect x="730" y="450" width="22" height="290" rx="2"/>
    <rect x="810" y="450" width="22" height="290" rx="2"/>
    <rect x="890" y="450" width="22" height="290" rx="2"/>
    <rect x="1010" y="450" width="22" height="290" rx="2"/>
    <rect x="1090" y="450" width="22" height="290" rx="2"/>
    <rect x="1170" y="450" width="22" height="290" rx="2"/>
  </g>

  <!-- Grand Academic Archway Entrance -->
  <path d="M 900 740 L 900 580 Q 960 520 1020 580 L 1020 740 Z" fill="#0A192F"/>
  <path d="M 915 740 L 915 590 Q 960 545 1005 590 L 1005 740 Z" fill="url(#goldRoof)" opacity="0.75"/>

  <!-- Grid of Illuminated Windows (Academic Classrooms & Laboratories) -->
  <g fill="#FFE699" opacity="0.85">
    <!-- Left Wing Windows -->
    <rect x="300" y="480" width="45" height="65" rx="3"/><rect x="380" y="480" width="45" height="65" rx="3"/><rect x="460" y="480" width="45" height="65" rx="3"/><rect x="540" y="480" width="45" height="65" rx="3"/><rect x="620" y="480" width="45" height="65" rx="3"/>
    <rect x="300" y="580" width="45" height="65" rx="3"/><rect x="380" y="580" width="45" height="65" rx="3"/><rect x="460" y="580" width="45" height="65" rx="3"/><rect x="540" y="580" width="45" height="65" rx="3"/><rect x="620" y="580" width="45" height="65" rx="3"/>
    <rect x="300" y="670" width="45" height="60" rx="3"/><rect x="380" y="670" width="45" height="60" rx="3"/><rect x="460" y="670" width="45" height="60" rx="3"/><rect x="540" y="670" width="45" height="60" rx="3"/><rect x="620" y="670" width="45" height="60" rx="3"/>

    <!-- Right Wing Windows -->
    <rect x="1240" y="480" width="45" height="65" rx="3"/><rect x="1320" y="480" width="45" height="65" rx="3"/><rect x="1400" y="480" width="45" height="65" rx="3"/><rect x="1480" y="480" width="45" height="65" rx="3"/><rect x="1560" y="480" width="45" height="65" rx="3"/>
    <rect x="1240" y="580" width="45" height="65" rx="3"/><rect x="1320" y="580" width="45" height="65" rx="3"/><rect x="1400" y="580" width="45" height="65" rx="3"/><rect x="1480" y="580" width="45" height="65" rx="3"/><rect x="1560" y="580" width="45" height="65" rx="3"/>
    <rect x="1240" y="670" width="45" height="60" rx="3"/><rect x="1320" y="670" width="45" height="60" rx="3"/><rect x="1400" y="670" width="45" height="60" rx="3"/><rect x="1480" y="670" width="45" height="60" rx="3"/><rect x="1560" y="670" width="45" height="60" rx="3"/>
  </g>

  <!-- Landscaping Trees (Indigenous Ugandan Palms and Acacia) -->
  <g fill="#0D351E">
    <ellipse cx="180" cy="740" rx="70" ry="110"/>
    <ellipse cx="230" cy="730" rx="60" ry="90"/>
    <ellipse cx="700" cy="745" rx="40" ry="60"/>
    <ellipse cx="1220" cy="745" rx="40" ry="60"/>
    <ellipse cx="1690" cy="730" rx="60" ry="90"/>
    <ellipse cx="1740" cy="740" rx="70" ry="110"/>
  </g>

  <!-- Subtle Vignette / Atmospheric Depth -->
  <rect width="1920" height="1080" fill="#0A192F" opacity="0.32"/>
</svg>
