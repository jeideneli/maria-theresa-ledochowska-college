<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="abBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#1B3B6F"/>
    </linearGradient>
    <linearGradient id="abGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F3C623"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="16" fill="url(#abBg)"/>
  <!-- Decorative Grid & Circles -->
  <circle cx="700" cy="100" r="180" fill="url(#abGold)" opacity="0.08"/>
  <circle cx="100" cy="500" r="140" fill="#2563EB" opacity="0.12"/>
  <!-- Library & Modern Lab Room Vector -->
  <rect x="80" y="140" width="640" height="380" rx="12" fill="#112240" stroke="#233554" stroke-width="2"/>
  <!-- Bookshelves -->
  <g fill="#1D3557">
    <rect x="110" y="170" width="160" height="28" rx="3"/><rect x="110" y="210" width="160" height="28" rx="3"/>
    <rect x="110" y="250" width="160" height="28" rx="3"/><rect x="110" y="290" width="160" height="28" rx="3"/>
  </g>
  <g fill="url(#abGold)" opacity="0.8">
    <rect x="120" y="174" width="12" height="20" rx="2"/><rect x="135" y="174" width="16" height="20" rx="2"/><rect x="155" y="174" width="8" height="20" rx="2"/>
    <rect x="120" y="214" width="18" height="20" rx="2"/><rect x="142" y="214" width="14" height="20" rx="2"/><rect x="160" y="214" width="16" height="20" rx="2"/>
    <rect x="120" y="254" width="10" height="20" rx="2"/><rect x="134" y="254" width="15" height="20" rx="2"/><rect x="153" y="254" width="18" height="20" rx="2"/>
  </g>
  <!-- Study / Collaboration Station -->
  <rect x="310" y="340" width="370" height="15" rx="4" fill="url(#abGold)"/>
  <rect x="330" y="355" width="15" height="130" fill="#233554"/>
  <rect x="645" y="355" width="15" height="130" fill="#233554"/>
  <!-- Laptops & Science Flasks -->
  <rect x="350" y="300" width="70" height="40" rx="4" fill="#64748B"/>
  <polygon points="340,340 430,340 420,335 350,335" fill="#94A3B8"/>
  <!-- Beakers & Flasks -->
  <path d="M 520 280 L 528 280 L 528 295 L 545 330 C 548 337 544 340 535 340 L 505 340 C 496 340 492 337 495 330 L 512 295 L 512 280 Z" fill="#38BDF8" opacity="0.85"/>
  <path d="M 565 295 L 572 295 L 572 305 L 585 330 C 588 336 585 340 577 340 L 553 340 C 545 340 542 336 545 330 L 558 305 L 558 295 Z" fill="#34D399" opacity="0.85"/>
  <!-- Students Collaborating Silhouettes -->
  <g fill="#F8FAFC" opacity="0.9">
    <!-- Student 1 -->
    <circle cx="390" cy="240" r="22"/>
    <path d="M 360 335 C 360 285 420 285 420 335 Z"/>
    <!-- Student 2 -->
    <circle cx="480" cy="235" r="22"/>
    <path d="M 450 335 C 450 280 510 280 510 335 Z"/>
    <!-- Student 3 -->
    <circle cx="600" cy="245" r="22"/>
    <path d="M 570 335 C 570 290 630 290 630 335 Z"/>
  </g>
  <!-- Floating Badge in Corner -->
  <rect x="440" y="80" width="250" height="65" rx="10" fill="#0A192F" stroke="url(#abGold)" stroke-width="2"/>
  <text x="565" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#F3C623" text-anchor="middle">EXCELLENCE IN ACTION</text>
  <text x="565" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#E2E8F0" text-anchor="middle">Modern Facilities &amp; Science Labs</text>
</svg>
